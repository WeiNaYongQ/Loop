<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loop* | Analytics</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/stats.css">
</head>
<body>
  <div class="ticker"></div>

  <nav class="topbar">
    <ul class="nav-links">
      <li><a href="index.html" class="nav-link">Dashboard</a></li>
      <li><a href="stats.html" class="nav-link active">Analytics</a></li>
      <li><a href="#" class="nav-link">Settings</a></li>
    </ul>
    <div class="flex items-center gap-2">
      <button class="btn btn-ghost" id="theme-btn">??</button>
      <a href="#" class="btn btn-primary" data-open-pro>Pro</a>
    </div>
  </nav>

  <main class="main-grid">
    
    <!-- Key Metrics -->
    <section class="card area-stats">
      <div class="flex justify-between items-center" style="margin-bottom: 1rem;">
        <h3 class="mono">TOTAL STREAK</h3>
        <span class="text-mint" id="streakValue">--</span>
      </div>
      <div class="timer-display mono"><span id="streakDays">--</span><span class="text-dust" style="font-size: 1.5rem;">d</span></div>
      <p class="text-dust">Current run</p>
    </section>

    <section class="card area-stats">
      <div class="flex justify-between items-center" style="margin-bottom: 1rem;">
        <h3 class="mono">COMPLETION RATE</h3>
        <span class="text-mint" id="completionValue">--</span>
      </div>
      <div class="timer-display mono"><span id="completionPct">--</span><span class="text-dust" style="font-size: 1.5rem;">%</span></div>
      <p class="text-dust">This week</p>
    </section>

    <section class="card area-stats">
      <div class="flex justify-between items-center" style="margin-bottom: 1rem;">
        <h3 class="mono">FOCUS TIME</h3>
        <span class="text-mint" id="focusValue">--</span>
      </div>
      <div class="timer-display mono"><span id="focusHours">--</span><span class="text-dust" style="font-size: 1.5rem;">h</span></div>
      <p class="text-dust">This month</p>
    </section>

    <!-- Monthly Matrix -->
    <section class="card" style="grid-column: span 12;">
      <h3 style="margin-bottom: 1rem;">Monthly Activity</h3>
      <div class="heatmap" id="monthlyHeatmap" style="grid-template-columns: repeat(31, 1fr);">
        <!-- Generated dynamically -->
      </div>
    </section>

    <!-- Performance Bars -->
    <section class="card" style="grid-column: span 6;">
      <h3 style="margin-bottom: 1rem;">Protocol Performance</h3>
      <div id="performanceBars">
        <!-- Dynamically populated -->
      </div>
    </section>

    <!-- Weekly Chart -->
    <section class="card" style="grid-column: span 6;">
      <h3 style="margin-bottom: 1rem;">Weekly Velocity</h3>
      <div id="weeklyChart" style="height: 200px; display: flex; align-items: flex-end; gap: 8px; padding: 1rem;">
        <!-- Dynamically populated -->
      </div>
      <div class="flex justify-between" style="padding: 0 1rem; color: var(--dust); font-size: 0.8rem;">
        <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
      </div>
    </section>

  </main>

  <dialog id="pro-modal">
    <h2 class="text-mint">Loop* Pro</h2>
    <p class="text-dust" style="margin: 1rem 0;">Unlock advanced analytics, unlimited habits, and cloud sync.</p>
    <button class="btn btn-primary" style="width: 100%;">Upgrade - $4/mo</button>
    <button class="btn" onclick="document.getElementById('pro-modal').close()" style="width: 100%; margin-top: 0.5rem;">Maybe Later</button>
  </dialog>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/habits.js"></script>
  <script src="js/stats.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
      
      // Pro Modal
      document.querySelectorAll('[data-open-pro]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.preventDefault();
          document.getElementById('pro-modal').showModal();
        });
      });
    });
  </script>
</body>
</html>
